name: Auto merge

on:
  pull_request:

permissions:
  contents: write
  checks: read
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    uses: clouddrove/github-shared-workflows/.github/workflows/pr-auto-merge.yml@v2
    with:
      # No cloud credentials exist here, so the wait-list is the set of checks
      # that actually run in these repos rather than the AWS/tfsec defaults.
      azure_cloud: true
      tfchecks_azure: '["tf-lint / tflint", "pr-validation / 📝 Validate PR title", "pr-validation / 🧾 Validate Commit Messages"]'
    secrets:
      GITHUB: ${{ secrets.GITHUB || github.token }}
