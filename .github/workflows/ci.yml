name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Terraform Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Init
        run: terraform init -backend=false

      - name: Test
        run: terraform test
        env:
          HCLOUD_TOKEN: dummy

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          # Without a token the action hits the unauthenticated GitHub API rate
          # limit and fails while resolving the tfsec release.
          github_token: ${{ github.token }}
          additional_args: --exclude-downloaded-modules --minimum-severity MEDIUM

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup terraform-docs
        uses: jaxxstorm/action-install-gh-release@v3
        with:
          repo: terraform-docs/terraform-docs

      - name: Check README
        run: |
          if grep -q "BEGIN_TF_DOCS" README.md; then
            terraform-docs markdown table --output-file README.md --output-mode inject .
            git diff --exit-code README.md
          fi
